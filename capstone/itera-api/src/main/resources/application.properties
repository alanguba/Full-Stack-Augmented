spring.application.name=itera
openai.api.base-url=https://api.openai.com/v1
openai.api.api-key=${OPEN_AI_TOKEN}
openai.api.model=gpt-4o-mini
timeout-seconds=60

# --- H2 datasource (en memoria) ---
spring.datasource.url=jdbc:h2:mem:iteradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Pexels Api
pexels.api-key=${PEXELS_TOKEN}

# --- Signing Key
jwt.signing.key=${SIGNING_KEY}
jwt.expiration.ms=1800000

# --- Logback config
logging.level.root=INFO

# --- GMAIL SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_SENDER}
spring.mail.password=${PASSWORD_SENDER}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#  timeouts
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=3000
spring.mail.properties[mail.smtp.writetimeout]=5000

