<div class="container">
  <div class="header">
    <h2>Users</h2>

    <a routerLink="/users/new" class="btn btn-primary">
      Create User
    </a>
  </div>

  <div class="user-card" *ngFor="let user of users">
    <div class="user-info">
      <h3>{{ user.name }}</h3>
      <p>{{ user.email }}</p>
    </div>

    <div class="actions">
      <a
        [routerLink]="['/users/edit', user.id]"
        class="btn btn-secondary">
        Edit
      </a>

      <button
        class="btn btn-danger"
        (click)="deleteUser(user.id!)">
        Delete
      </button>
    </div>
  </div>
</div>
